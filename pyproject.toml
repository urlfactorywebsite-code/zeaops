[project]
name = "zeaops-api"
version = "0.1.0"
description = "Local-first ZeaOPS control-plane foundation"
requires-python = ">=3.14.10,<3.15"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx2==2.16.0", "ruff==0.17.5", "mypy==2.4.1", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]
markers = ["integration: requires the isolated local PostgreSQL database"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["apps/api/src"]
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src"
